name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS: the app targets macOS, and better-sqlite3 is rebuilt for
    # Electron's ABI on install, so tests run inside Electron's Node.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  never-black:
    # Real-decoder tier: Chromium plays actual MPEG-TS through a stream swap.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup:browser
      - run: npm run test:browser
