<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    OnAir app icon: a studio ON AIR tally lamp, lit.
    Squircle follows the macOS icon grid (824px body, 100px margin).
    Render with: npm run icon
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.55" stop-color="#151518"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff453a" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#ff453a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff453a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bezel" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="0.8" stop-color="#101012"/>
      <stop offset="1" stop-color="#1d1d21"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.38" r="0.62" fx="0.46" fy="0.3">
      <stop offset="0" stop-color="#ff9a8c"/>
      <stop offset="0.38" stop-color="#ff4f42"/>
      <stop offset="0.78" stop-color="#e2261b"/>
      <stop offset="1" stop-color="#a3110b"/>
    </radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd2c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd2c8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Drop shadow under the body, per the macOS template. -->
  <rect x="100" y="112" width="824" height="824" rx="186" fill="#000" opacity="0.38" filter="url(#shadow)"/>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#body)"/>
    <!-- The lamp lights the housing around it. -->
    <circle cx="512" cy="512" r="420" fill="url(#ambient)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Recessed bezel. -->
  <circle cx="512" cy="512" r="262" fill="url(#bezel)"/>
  <circle cx="512" cy="512" r="259" fill="none" stroke="url(#lip)" stroke-width="6"/>

  <!-- Light spilling out of the lens. -->
  <circle cx="512" cy="512" r="212" fill="#ff3b30" opacity="0.9" filter="url(#glow)"/>

  <!-- Lens. -->
  <circle cx="512" cy="512" r="196" fill="url(#lens)"/>
  <circle cx="512" cy="512" r="194" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="4"/>

  <!-- The filament's hot core, then a soft specular on the glass. -->
  <circle cx="512" cy="530" r="120" fill="url(#core)"/>
  <ellipse cx="512" cy="410" rx="120" ry="58" fill="url(#spec)" filter="url(#soft)"/>
</svg>
