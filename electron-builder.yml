appId: com.onair.app
productName: OnAir
directories:
  buildResources: resources
files:
  - out/**/*
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  extendInfo:
    NSCameraUsageDescription: ''
    NSMicrophoneUsageDescription: ''
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
  artifactName: ${name}-${version}-setup.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
linux:
  target:
    - target: AppImage
  artifactName: ${name}-${version}.${ext}
